<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack Pals: Cozy Charms</title>
<meta name="description" content="Pack Pals: Cozy Charms is a cozy game about collecting cute charms and pins and decorating backpacks.">
<style>
  :root { --bg: #ffe9dc; --ink: #3b2440; --pink: #ff6f91; --card: #fff8f2; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #ffd6e6, #e6dcff 55%, #cfeaff); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { max-width: 560px; width: 100%; background: var(--card); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); padding: 32px 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 2rem; line-height: 1.15; }
  p { margin: 0 0 20px; }
  a.btn { display: inline-block; background: var(--pink); color: #fff; text-decoration: none; font-weight: 800; padding: 12px 22px; border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink); }
  small { display: block; margin-top: 24px; opacity: .7; }
</style>
</head>
<body>
<main>
  <h1>🎒 Pack Pals: Cozy Charms</h1>
  <p>Collect 270+ cute charms and pins from capsule machines, hang them on your favorite backpacks, decorate your cozy room and nap with your pet pal.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.packpals.myapp">Get it on Google Play</a>
  <small>© Dosu Games</small>
</main>
</body>
</html>
